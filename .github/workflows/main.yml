name: Check new chapter

on:
  push:
    branches:
      - main
    paths:
      - 'share/**'
      
jobs:
  faq-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install and configure uv (and Python automatically)
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11' # Change to your preferred version

      # Step 3: Install your project as a tool globally on the runner
      - name: Install faq
        run: uv tool install .

      # Step 4: Run your tool using your usual terminal name
      - name: Execute faq check
        run: faq --check
