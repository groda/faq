name: Faq Check
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
jobs:
  faq-check:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone the repository
      - uses: actions/checkout@v7.0.1
      # Step 2: Install and configure uv (and Python automatically)
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11' # Change to your preferred version
      # Step 3: Run check
      - run: uv run faq --check

